name: Web

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'web/admin/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'web/admin/**'
      - '.github/workflows/web.yml'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        working-directory: web/admin
        run: npm ci

      - name: Typecheck
        working-directory: web/admin
        run: npm run typecheck

      - name: Lint
        working-directory: web/admin
        run: npm run lint

      - name: Build
        working-directory: web/admin
        run: npm run build

      # dist 提交入库，保证 git clone 后 go build 直接可用；产物与源码不一致即失败。
      # 先 add 再 diff --cached：新增的 hash 文件是未跟踪状态，单纯 git diff 看不到。
      - name: Verify committed dist is up to date
        run: |
          git add -A web/admin/dist
          git diff --cached --exit-code web/admin/dist
